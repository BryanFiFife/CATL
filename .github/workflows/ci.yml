name: CATL security tests
# Manual execution only: GitHub Actions minutes must not be consumed automatically.
# Owner explicitly launches runs from Actions > CATL security tests > Run workflow.
on: [workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: catl-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regressions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
      CATL_CI_HEADLESS: '1'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # pinned SHA (verify availability in Actions)
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # pinned SHA
        with:
          python-version: ${{ matrix.python }}
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -e .
      - name: Compile and test without desktop
        shell: bash
        run: |
          python -m compileall -q src tests examples
          python -m unittest discover -s tests -v
      - name: Preflight CLI entry point
        run: python -m catl --help
      - name: Static security sanity checks
        run: python tools/security_sanity.py
  windows-portability-only:
    # Windows protected execution is NOT implemented. These tests validate
    # portable policy code, CLI and explicit fail-closed behaviour only.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Install portable runtime dependencies
        run: python -m pip install --disable-pip-version-check -e .
      - name: Portable policy, static and fail-closed tests (NOT a Windows broker test)
        shell: bash
        run: |
          python -m unittest discover -s tests -p test_policy.py -v
          python -m unittest discover -s tests -p test_static_security.py -v
          python -m unittest discover -s tests -p test_windows_portability.py -v
          python -m catl --help
          python -m catl doctor --help
          python -m unittest discover -s tests -p test_host_audit.py -v

  linux-graphical-and-identity:
    # This job uses sudo to test kernel peer credentials. Never execute forked
    # PR-supplied code with elevated privileges, especially when public.
    # Unprivileged portable tests still run for external contributions.
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.owner.login == github.repository_owner)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check -e .
      - name: Install display/identity test prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb util-linux
      - name: Run graphical tests
        run: xvfb-run -a python -m unittest discover -s tests -q
      - name: Run separate-UID broker integration
        shell: bash
        run: |
          # Hosted runner workspaces may not be traversable by synthetic UIDs.
          # Stage only public test source outside the runner's private home.
          stage="$(mktemp -d /tmp/catl-identity-ci.XXXXXXXX)"
          trap 'sudo rm -rf "$stage"' EXIT
          cp -R src tests examples tools "$stage/"
          chmod -R a+rX "$stage"
          sudo env "PYTHONPATH=$stage/src" "$(command -v python)" "$stage/tests/integration_rootless_e2e.py"
      - name: Red-team agent-flood must not block operator emergency access
        shell: bash
        run: |
          stage="$(mktemp -d /tmp/catl-redteam-ci.XXXXXXXX)"
          trap 'sudo rm -rf "$stage"' EXIT
          cp -R src tests "$stage/"
          chmod -R a+rX "$stage"
          sudo env "PYTHONPATH=$stage/src:$stage/tests" "$(command -v python)" \
            -m unittest test_redteam_dos_v010.OperatorFloodTests -v

  security-scans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install scanners
        run: python -m pip install --disable-pip-version-check bandit pip-audit
      - name: High-severity / high-confidence Python static scan
        run: bandit -q -r src/catl -ll -ii
      - name: Published dependency vulnerability database check
        run: pip-audit --no-deps --requirement requirements-security-audit.txt

  linux-host-preflight-recovery:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check -e .
      - name: Synthetic database rollback drill must fail closed
        run: python tools/recovery_drill.py
      - name: Uncertain tool dispatch must remain quarantined after restart
        run: python tools/incident_drill.py
      - name: Parse unit templates without requiring a running systemd host
        shell: bash
        run: |
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          for unit in broker backend; do
            sed -E 's@/usr/local/bin/catl@/usr/bin/true@g;s/BROKER_UID/1001/g;s/BACKEND_IPC_GID/1002/g;s/AGENT_UID/1003/g;s/OPERATOR_UID/1004/g;s/AGENT_GID/1005/g;s/OPERATOR_GID/1006/g;s/TOOLS_UID/1007/g' \
              "packaging/systemd/catl-${unit}.service.example" > "$stage/catl-${unit}.service"
          done
          systemd-analyze verify "$stage/catl-broker.service" "$stage/catl-backend.service"
      - name: No live services must never be marked attested
        run: |
          python - <<'PYHOST'
          import json, subprocess, sys
          proc=subprocess.run([sys.executable,'-m','catl','host-audit'],capture_output=True,text=True)
          data=json.loads(proc.stdout)
          assert proc.returncode != 0 and not data['passed'], data
          PYHOST

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Build and independently verify release archive
        run: |
          python tools/release_pack.py --output /tmp/catl-release-candidate.zip
          python tools/release_pack.py --verify /tmp/catl-release-candidate.zip
      - name: Build source wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Install wheel into isolated venv
        shell: bash
        run: |
          python -m venv /tmp/catl-candidate-venv
          /tmp/catl-candidate-venv/bin/python -m pip install dist/*.whl
          /tmp/catl-candidate-venv/bin/catl --help
          /tmp/catl-candidate-venv/bin/catl doctor --help
          /tmp/catl-candidate-venv/bin/catl host-audit --help
          /tmp/catl-candidate-venv/bin/catl operator --help
          /tmp/catl-candidate-venv/bin/catl operator incidents --help
